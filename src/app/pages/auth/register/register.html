<div class="login-page">
  <div class="login-card">
    <div class="card-bg-overlay"></div>

    <div class="header">
      <p class="welcome-sub">Bienvenido a</p>
      <h1>BookSphere</h1>
      <p class="tagline">La esencia de la lectura en un solo lugar.</p>
    </div>

    <div class="form-illustration-row">
      <div class="form-area">
        <div class="illutration-container">
          <img src="/auth/books.png" alt="" class="form-illustration" />
        </div>

        <!-- Solo un formulario principal -->
        <form class="login-form" (submit)="$event.preventDefault()">
          
          <div class="input-group">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <path d="M2 7l10 7 10-7" />
              </svg>
            </span>
            <!-- Agregado name="correo" y quitado el <form> interno -->
            <input type="email" name="correo" [(ngModel)]="correo" placeholder="Correo" autocomplete="email" />
          </div>

          <div class="input-group">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </span>
            <!-- Agregado name="password" y quitado el <form> interno -->
            <input type="password" name="password" placeholder="Contraseña" [(ngModel)]="password" autocomplete="current-password" />
          </div>

          <button type="submit" class="role-btn" (click)="LoginCliente()">Iniciar Sesión</button>

          <div class="register-row">
            <span>¿No tiene una cuenta?</span>
            <a href="#">Crear cuenta nueva</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
