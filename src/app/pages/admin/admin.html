
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Librería</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="admin-container">

       <div class="admin-container">
    <!-- Header -->
    <div class="admin-header">
        <div class="logo">
            <h1><i class="fas fa-book-open"></i> Librería Admin</h1>
            <p>Panel de gestión integral</p>
        </div>
        <div class="admin-info">
            <span><i class="fas fa-user-shield"></i> <span>Administrador</span></span>
            <button class="btn-logout" (click)="irLogin()">
                <i class="fas fa-sign-out-alt"></i> Cerrar sesión
            </button>
        </div>
    </div>

    <!-- Tabs de navegación -->
    <div class="tabs-container">
        <button class="tab-btn" [class.active]="selecEntidad === 'clientes'" (click)="cargarEntidad('clientes')">
            <i class="fas fa-users"></i> Clientes
        </button>
        <button class="tab-btn" [class.active]="selecEntidad === 'libros'" (click)="cargarEntidad('libros')">
            <i class="fas fa-book"></i> Libros
        </button>
        <button class="tab-btn" [class.active]="selecEntidad === 'proveedor'" (click)="cargarEntidad('proveedor')">
            <i class="fas fa-truck"></i> Proveedores
        </button>
        <button class="tab-btn" [class.active]="selecEntidad === 'categoria'" (click)="cargarEntidad('categoria')">
            <i class="fas fa-tags"></i> Categorías
        </button>
    </div>

    <!-- Contenido Dinámico según la Entidad Seleccionada -->
    <div class="tab-content active">
        <div class="section-header">
            <h2>
                <i class="fas fa-th-list"></i> 
                Gestión de {{ selecEntidad | titlecase }}
            </h2>
            <!-- BOTÓN CREAR: Llama a abrirModal SIN parámetros -->
            <button class="btn-primary" (click)="abrirModal()">
                <i class="fas fa-plus"></i> Nuevo {{ selecEntidad | titlecase }}
            </button>
        </div>

        <div class="table-container">
            <table class="tabla-general">
                <thead>
                    <tr>
                        <!-- Cabeceras Dinámicas -->
                        <th *ngFor="let head of headers">{{ head | titlecase }}</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Filas Dinámicas -->
                    <tr *ngFor="let registro of entidad">
                        <td *ngFor="let item of registro | keyvalue: originalOrder">
                            {{ item.value }}
                        </td>
                        <td>
                            <!-- BOTÓN EDITAR: Llama a abrirModal CON el registro actual -->
                            <button class="btn-view" (click)="abrirModal(registro)">
                                <i class="fas fa-edit"></i> VER/EDITAR
                            </button>
                            <!-- BOTÓN ELIMINAR: Llama a abrirModal CON el registro actual -->
                            <button class="btn-delete" (click)="eliminar(registro)">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <!-- Mensaje si la tabla está vacía -->
            <div *ngIf="entidad.length === 0" class="no-data">
                No hay registros para mostrar.
            </div>
        </div>
    </div>
</div>

<!-- ==================== MODAL DINÁMICO (CREAR / EDITAR) ==================== -->
<div class="modal-overlay" *ngIf="mostrarModal" (click)="cerrarModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h2>{{ editando ? 'Editar' : 'Nuevo' }} {{ selecEntidad | titlecase }}</h2>
            <button class="btn-close" (click)="cerrarModal()">&times;</button>
        </div>
        
        <div class="modal-body">
            <form #formPost="ngForm">
                <!-- Genera un input por cada cabecera de la tabla -->
                <div class="form-group" *ngFor="let head of headers">
                    <!-- Ocultamos el campo ID para que no sea editable -->
                    <ng-container *ngIf="head.toLowerCase() !== 'id'">
                        <label>{{ head | titlecase }}</label>
                        <input type="text" 
                               class="form-input" 
                               [name]="head" 
                               [ngModel]="registroSeleccionado?.[head]"
                               required>
                    </ng-container>
                </div>
            </form>
        </div>

        <div class="modal-footer">
            <button class="btn-secondary" (click)="cerrarModal()">Cancelar</button>
            <button class="btn-primary" (click)="guardarPost(formPost.value)">
                {{ editando ? 'Actualizar Cambios' : 'Guardar Nuevo' }}
            </button>
        </div>
    </div>
</div>
